# Define the events block (required by Nginx)
events {
    worker_connections 1024;  # Adjust based on the load and number of simultaneous connections
}

# Define the HTTP context
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_user_agent $is_social_bot {
        default                   0;
        ~*whatsapp                1;
        ~*facebookexternalhit     1;
        ~*meta-externalagent      1;
        ~*twitterbot              1;
        ~*linkedinbot             1;
        ~*slackbot                1;
        ~*telegrambot             1;
        ~*discordbot              1;
        ~*iframely                1;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/xml
        text/plain;

    server {
        listen 80;
        server_name _;

        # Security headers (defense-in-depth). Note: nginx only inherits add_header into a block that
        # has no add_header of its own, so these are repeated in the index.html/static blocks below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Reverse Proxy to the Backend API
        location /api/ {
            proxy_pass http://open-event-backend-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reject dotfiles/dot-directories (.env, .git/, .aws/, .ssh/, ...) instead of
        # falling back to the SPA's index.html. Regex locations take precedence over
        # the plain-prefix "location /" below regardless of declaration order.
        location ~ /\. {
            return 404;
        }

        # Reject requests for common non-Angular file extensions (scanner bait such as
        # wp-config.php.bak) instead of serving index.html for them.
        location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|pl|py|rb|sh|sql|bak|backup|old|orig|swp|save|log|ini|conf|yml|yaml|env)$ {
            return 404;
        }

        # Reject well-known scanner probe paths that carry no distinguishing extension
        # (Spring Boot actuator, WordPress, CGI, vendor dumps) rather than the SPA index.
        location ~ ^/(actuator|wp-admin|wp-content|wp-includes|wp-json|cgi-bin|vendor|xmlrpc\.php)(/|$) {
            return 404;
        }

        # image upload directory
         location /upload/ {
                alias /usr/share/nginx/html/upload/;
                autoindex off;
         }

        # OG preview for social media bots on event detail pages
        location ~ ^/external/event/([^/]+)(?:/.*)?$ {
            set $event_id $1;

            if ($is_social_bot) {
                proxy_pass http://open-event-backend-service:8080/api/external/event/$event_id/og-preview;
            }

            root /usr/share/nginx/html;
            try_files /external/index.html =404;
        }

        # External app - handles /external/ paths
        location /external/ {
            alias /usr/share/nginx/html/external/;
            index index.html;
            try_files $uri $uri/ @external_fallback;
        }

        # Fallback for external app routing
        location @external_fallback {
            rewrite ^/external/(.*)$ /external/index.html last;
        }

        # Cache control for external app index.html
        location = /external/index.html {
            alias /usr/share/nginx/html/external/index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }

        # JS-free preview for known social/link-preview crawlers hitting the bare homepage.
        # Without this, a JS-executing crawler with no cookies (e.g. Meta's link-preview bot)
        # loads the Angular bundle, which forces a Keycloak login redirect (see main app's
        # login-required/check-sso init) that can spiral into an oversized redirect_uri.
        location = / {
            if ($is_social_bot) {
                rewrite ^ /bot-preview.html break;
            }
            root /usr/share/nginx/html/app;
            try_files /index.html =404;
        }

        # Main app - handles all other paths (root)
        location / {
            root /usr/share/nginx/html/app;
            try_files $uri $uri/ /index.html;

            # Disable caching for index.html
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires 0;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Content-Security-Policy "frame-ancestors 'self'" always;
            }

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Error handling
        error_page 404 /app/index.html;
    }
}
