<header class="flex items-start justify-between gap-3 px-6 pt-6">
    <div>
        <h2 class="text-2xl font-normal">{{ 'event.own.action.share' | translate }}</h2>
        <p class="mt-1.5 text-sm text-on-surface-variant">{{ eventTitle }}</p>
    </div>
    <button matIconButton (click)="close()">
        <mat-icon>close</mat-icon>
    </button>
</header>

<lib-loading-bar [reloading]="reloading()"></lib-loading-bar>

@if (info(); as eventInfo) {
    <portal-share-details [info]="eventInfo" [reloading]="reloading()" (closed)="close()"></portal-share-details>
}
