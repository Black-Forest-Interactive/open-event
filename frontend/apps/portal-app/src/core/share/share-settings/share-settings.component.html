<div class="p-3 font-medium">{{ 'share.title' | translate }}</div>
<mat-divider></mat-divider>
<div class="flex flex-col gap-3 p-3">
    <div class="flex items-center justify-between gap-3">
        <span class="text-sm">{{ (active() ? 'share.action.disable' : 'share.action.enable') | translate }}</span>
        <mat-slide-toggle [checked]="active()" [disabled]="reloading()" (change)="toggle()"></mat-slide-toggle>
    </div>
    <p class="text-xs text-on-surface-variant text-justify hyphens-auto">
        <span class="font-medium">{{ 'share.info.disclaimer.title' | translate }}:</span>
        {{ 'share.info.disclaimer.content' | translate }}
    </p>
</div>
