<div class="px-3 sm:px-4 pt-4 pb-1">
    <h1 class="text-2xl font-semibold text-on-surface">{{ 'event.board.intro.regsTitle' | translate }}</h1>
    <p class="text-sm text-on-surface-variant">{{ 'event.board.intro.regsSubtitle' | translate }}</p>
</div>

<div class="sticky top-0 z-10 flex flex-col gap-2 px-3 py-2 sm:px-4 border-b bg-surface-container-lowest border-outline-variant">
    <div class="flex items-center gap-2">
        <lib-board-search (searchChange)="setQuery($event)" class="flex-auto max-w-lg" data-tour="event-search" placeholder="event.search"></lib-board-search>
        <span class="hidden lg:inline text-sm text-on-surface-variant whitespace-nowrap">
            <b>{{ totalSize() }}</b> {{ 'event.board.results' | translate }}
        </span>
    </div>
</div>

<lib-loading-bar [reloading]="reloading()"></lib-loading-bar>

<div class="p-4 pb-20 lg:pb-4">
    <portal-event-board-list [entries]="entries()" [reloading]="reloading()" layout="rows" navView="regs" [hasMoreElements]="hasMoreElements()" (nearEnd)="onScroll()"></portal-event-board-list>
</div>

<portal-event-board-navbar></portal-event-board-navbar>
