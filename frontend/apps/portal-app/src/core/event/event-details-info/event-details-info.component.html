<div class="flex flex-col gap-4 p-4">
    <div>
        <h1 class="text-2xl font-normal leading-tight">{{ info().event.title }}</h1>
        @if (info().event.shortText.length > 0) {
            <p class="text-base text-on-surface-variant mt-2">{{ info().event.shortText }}</p>
        }
    </div>

    <portal-event-fact-row [info]="info()"></portal-event-fact-row>

    @if (info().event.tags.length > 0) {
        <div class="flex flex-row flex-wrap gap-2">
            @for (tag of info().event.tags; track tag) {
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs bg-surface-container-high text-on-surface-variant">#{{ tag }}</span>
            }
        </div>
    }

    @if (info().event.longText.length > 0) {
        <section class="border-t border-outline-variant pt-4">
            <h2 class="text-lg font-medium mb-3">{{ 'event.detail.about' | translate }}</h2>
            <div [innerHTML]="info().event.longText" class="prose prose-sm max-w-none text-on-surface"></div>
        </section>
    }
</div>
