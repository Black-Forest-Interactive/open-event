@if (visible()) {
    <div class="flex flex-wrap items-center gap-2">
        @for (chip of chips(); track chip.kind + chip.key) {
            <button (click)="remove(chip)" [class.achip--out]="chip.out" class="achip" type="button">
                @if (chip.out) {
                    <mat-icon style="font-size: 16px; width: 16px; height: 16px">block</mat-icon>
                    {{ 'filter.tri.without' | translate }}
                }
                {{ chip.key }}
                <mat-icon style="font-size: 14px; width: 14px; height: 14px">close</mat-icon>
            </button>
        }
        @if (showAvailableOnly()) {
            <button (click)="clearAvailable.emit()" class="achip" type="button">
                {{ 'event.filter.onlyAvailable' | translate }}
                <mat-icon style="font-size: 14px; width: 14px; height: 14px">close</mat-icon>
            </button>
        }
        <button (click)="resetFilter.emit()" class="achip achip--clear" type="button">{{ 'event.filter.reset' | translate }}</button>
    </div>
}
