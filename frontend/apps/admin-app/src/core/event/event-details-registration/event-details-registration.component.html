<mat-card>
    <div class="flex flex-col gap-4 p-5">
        <div class="flex flex-row items-center justify-between gap-3 flex-wrap">
            <h2 class="text-lg font-medium m-0">{{ 'registration.title' | translate }}</h2>
            <div class="flex flex-row gap-2">
                <button (click)="addParticipantAccount()" matButton="tonal">
                    <mat-icon>person_add</mat-icon>
                    {{ 'registration.action.participateAccount' | translate }}
                </button>
                <button (click)="addParticipantManual()" matButton="tonal">
                    <mat-icon>edit_note</mat-icon>
                    {{ 'registration.action.participateManual' | translate }}
                </button>
            </div>
        </div>
        <admin-registration-table (changeResponse)="handleParticipateResponse($event)" [data]="event().registration!!"/>
    </div>
</mat-card>
