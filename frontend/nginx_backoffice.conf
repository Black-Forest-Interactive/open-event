# Define the events block (required by Nginx)
events {
    worker_connections 1024;  # Adjust based on the load and number of simultaneous connections
}

# Define the HTTP context
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/xml
        text/plain;

    server {
      listen 80;
      server_name _;

      # Security headers (defense-in-depth). Repeated in blocks that set their own add_header,
      # because nginx does not inherit add_header into a block that has any add_header of its own.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "frame-ancestors 'self'" always;

      # Disable caching for index.html and other dynamic files
      location = /index.html {
          root /usr/share/nginx/html;
          expires -1;   # Disable caching for index.html
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires 0;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Content-Security-Policy "frame-ancestors 'self'" always;
          try_files $uri $uri/ /index.html;
      }

      # Reverse Proxy to the Backend API
      location /api/ {
        proxy_pass http://open-event-backend-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Serve static files
      location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  # If the requested file doesn't exist, serve index.html
      }

      # Health check endpoint
      location /health {
          access_log off;
          return 200 "healthy\n";
          add_header Content-Type text/plain;
      }

      # Error handling
      error_page  404              /index.html;
  }
}
